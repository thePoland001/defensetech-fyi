# Render Blueprint: one Node web service. The database lives outside Render (Neon's free
# Postgres by default) because Render's free Postgres is deleted after 30 days.
# In Render: New → Blueprint → pick this repo, then paste the Neon connection string when
# it asks for DATABASE_URL. SESSION_SECRET and ADMIN_TOKEN are generated for you.
services:
  - type: web
    name: defensetech-fyi
    runtime: node
    plan: free
    # Keep this next to the database: create the Neon project in AWS us-east-2 (Ohio).
    # Render can't move a service to another region after it's created.
    region: ohio
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DATABASE_URL
        sync: false
