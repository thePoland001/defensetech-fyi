# Render Blueprint: one Node web service + one Postgres database.
# In Render: New → Blueprint → pick this repo. SESSION_SECRET and DATABASE_URL are wired up automatically.
services:
  - type: web
    name: defensetech-fyi
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: defensetech-db
          property: connectionString

databases:
  - name: defensetech-db
    plan: free
    databaseName: defensetech
    user: defensetech
    ipAllowList: []
